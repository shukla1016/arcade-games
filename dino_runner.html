<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Dino Desert Run</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@600;800;900&display=swap');

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 10%,#ffe7a3 0%,#f5b66b 35%,#d86f58 75%,#713d52 100%);
    font-family:'Nunito',sans-serif;
    overflow:hidden;
}

.game-shell{
    width:min(1100px,96vw);
    height:min(700px,94vh);
    position:relative;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 25px 70px rgba(48,24,35,.45);
    border:4px solid rgba(255,255,255,.3);
    background:#f5bd72;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.hud{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
    z-index:5;
}

.logo{
    font-family:'Righteous',cursive;
    color:#542f3a;
    font-size:clamp(22px,3vw,34px);
    text-shadow:2px 3px 0 rgba(255,255,255,.35);
}

.stats{
    display:flex;
    gap:10px;
    align-items:center;
}

.stat{
    min-width:105px;
    padding:9px 15px;
    border-radius:15px;
    background:rgba(255,247,220,.82);
    color:#54323a;
    box-shadow:0 5px 15px rgba(90,40,40,.15);
    text-align:center;
}

.stat small{
    display:block;
    font-size:10px;
    letter-spacing:1px;
    opacity:.7;
}

.stat b{
    font-size:22px;
}

.pause{
    pointer-events:auto;
    border:0;
    background:#54323a;
    color:white;
    width:44px;
    height:44px;
    border-radius:13px;
    font-size:19px;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(50,20,20,.2);
}

.overlay{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(62,33,43,.27);
    backdrop-filter:blur(4px);
}

.panel{
    width:min(460px,88%);
    padding:35px 30px;
    text-align:center;
    border-radius:28px;
    background:#fff5d9;
    color:#4f3037;
    box-shadow:0 25px 60px rgba(50,20,20,.35);
    border:4px solid rgba(255,255,255,.65);
}

.panel h1{
    margin:0 0 8px;
    font-family:'Righteous',cursive;
    font-size:clamp(40px,7vw,64px);
    color:#d75f4d;
}

.panel p{
    line-height:1.6;
    margin:10px 0 22px;
}

.start-btn{
    border:0;
    padding:14px 32px;
    border-radius:16px;
    background:#d85d4d;
    color:white;
    font-family:'Nunito';
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 7px 0 #a8413d;
    transition:.12s;
}

.start-btn:active{
    transform:translateY(5px);
    box-shadow:0 2px 0 #a8413d;
}

.controls{
    margin-top:18px;
    font-size:13px;
    opacity:.72;
}

.hidden{
    display:none;
}

.mobile-controls{
    position:absolute;
    bottom:15px;
    left:15px;
    right:15px;
    z-index:6;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.mobile-btn{
    pointer-events:auto;
    border:0;
    width:65px;
    height:65px;
    border-radius:50%;
    background:rgba(255,247,220,.78);
    color:#56343b;
    font-size:25px;
    box-shadow:0 5px 15px rgba(60,30,30,.18);
    user-select:none;
}

@media(max-width:600px){

    .game-shell{
        width:100vw;
        height:100vh;
        border-radius:0;
        border:0;
    }

    .hud{
        top:12px;
        left:12px;
        right:12px;
    }

    .stats{
        gap:5px;
    }

    .stat{
        min-width:70px;
        padding:6px 9px;
    }

    .stat b{
        font-size:17px;
    }

    .stat small{
        font-size:8px;
    }

    .pause{
        width:39px;
        height:39px;
    }

    .logo{
        font-size:20px;
    }

    .mobile-btn{
        width:58px;
        height:58px;
    }
}
</style>
</head>

<body>

<div class="game-shell">

    <canvas id="game"></canvas>

    <div class="hud">

        <div class="logo">
            DINO RUN
        </div>

        <div class="stats">

            <div class="stat">
                <small>SCORE</small>
                <b id="score">0</b>
            </div>

            <div class="stat">
                <small>BEST</small>
                <b id="best">0</b>
            </div>

            <button class="pause" id="pauseBtn">
                Ⅱ
            </button>

        </div>

    </div>

    <div class="mobile-controls">

        <button class="mobile-btn" id="jumpBtn">
            ↑
        </button>

        <button class="mobile-btn" id="duckBtn">
            ↓
        </button>

    </div>

    <div class="overlay" id="overlay">

        <div class="panel">

            <h1 id="title">
                DINO RUN
            </h1>

            <p id="message">
                Run through the desert, jump over cacti,
                duck under flying enemies and collect coins!
            </p>

            <button class="start-btn" id="startBtn">
                START RUN
            </button>

            <div class="controls">
                SPACE / ↑ = Jump &nbsp; • &nbsp;
                ↓ = Duck
            </div>

        </div>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const scoreEl =
    document.getElementById("score");

const bestEl =
    document.getElementById("best");

const overlay =
    document.getElementById("overlay");

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const startBtn =
    document.getElementById("startBtn");

const pauseBtn =
    document.getElementById("pauseBtn");

const jumpBtn =
    document.getElementById("jumpBtn");

const duckBtn =
    document.getElementById("duckBtn");


let W = 1000;
let H = 600;
let groundY = 500;


function resize(){

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    W = rect.width;
    H = rect.height;

    groundY =
        H * .79;

    dino.reset();
}


window.addEventListener(
    "resize",
    resize
);


let running = false;
let paused = false;
let gameOver = false;

let score = 0;

let best =
    Number(
        localStorage.getItem(
            "dino-desert-best"
        ) || 0
    );

bestEl.textContent = best;

let speed = 6;

let distance = 0;

let obstacles = [];

let coins = [];

let particles = [];

let spawnTimer = 0;

let coinTimer = 0;

let lastTime =
    performance.now();


const dino = {

    x:0,

    y:0,

    width:48,

    height:58,

    vy:0,

    grounded:true,

    ducking:false,


    reset(){

        this.x =
            W * .16;

        this.y =
            groundY -
            this.height;

        this.vy = 0;

        this.grounded = true;

        this.ducking = false;
    }
};


dino.reset();


function startGame(){

    running = true;

    paused = false;

    gameOver = false;

    score = 0;

    speed = 6;

    distance = 0;

    obstacles = [];

    coins = [];

    particles = [];

    spawnTimer = 70;

    coinTimer = 50;

    dino.reset();

    scoreEl.textContent = "0";

    overlay.classList.add("hidden");

    pauseBtn.textContent = "Ⅱ";
}


function endGame(){

    running = false;

    gameOver = true;

    if(score > best){

        best = score;

        localStorage.setItem(
            "dino-desert-best",
            best
        );

        bestEl.textContent = best;
    }

    title.textContent =
        "GAME OVER";

    message.innerHTML =
        `You ran <b>${score}</b> meters!<br>
         Best distance: <b>${best}</b>`;

    startBtn.textContent =
        "RUN AGAIN";

    overlay.classList.remove(
        "hidden"
    );
}


function jump(){

    if(!running || paused)
        return;

    if(dino.grounded){

        dino.vy = -12.5;

        dino.grounded = false;

        createDust(
            dino.x + 15,
            groundY - 5,
            5
        );
    }
}


function setDuck(value){

    if(!running || paused)
        return;

    dino.ducking =
        value && dino.grounded;
}


document.addEventListener(
    "keydown",
    e => {

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            if(
                !running &&
                !gameOver
            ){

                startGame();

            }else{

                jump();
            }
        }


        if(e.code === "ArrowDown"){

            e.preventDefault();

            setDuck(true);
        }


        if(
            e.code === "KeyP" ||
            e.code === "Escape"
        ){

            togglePause();
        }
    }
);


document.addEventListener(
    "keyup",
    e => {

        if(e.code === "ArrowDown"){

            setDuck(false);
        }
    }
);


canvas.addEventListener(
    "pointerdown",
    e => {

        if(!running || paused)
            return;

        jump();
    }
);


jumpBtn.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        jump();
    }
);


duckBtn.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        setDuck(true);
    }
);


duckBtn.addEventListener(
    "pointerup",
    () => {

        setDuck(false);
    }
);


duckBtn.addEventListener(
    "pointercancel",
    () => {

        setDuck(false);
    }
);


duckBtn.addEventListener(
    "pointerleave",
    () => {

        setDuck(false);
    }
);


startBtn.addEventListener(
    "click",
    startGame
);


pauseBtn.addEventListener(
    "click",
    togglePause
);


function togglePause(){

    if(!running)
        return;

    paused = !paused;

    pauseBtn.textContent =
        paused ? "▶" : "Ⅱ";
}


/* ============================
   OBSTACLES
============================ */

function spawnObstacle(){

    const flying =
        Math.random() <
        Math.min(
            .30,
            score / 700
        );


    if(flying){

        obstacles.push({

            type:"bird",

            x:W + 50,

            y:
                groundY -
                95 -
                Math.random()*55,

            width:48,

            height:28,

            passed:false,

            flap:
                Math.random() *
                Math.PI * 2

        });

    }else{

        const tall =
            Math.random() < .28;

        obstacles.push({

            type:"cactus",

            x:W + 50,

            y:
                groundY -
                (tall ? 68 : 48),

            width:
                tall ? 35 : 28,

            height:
                tall ? 68 : 48,

            passed:false
        });
    }
}


/* ============================
   FIXED COIN SPAWNING
============================ */

function spawnCoin(){

    /*
       Dino jump physics:

       Initial velocity = -12.5
       Gravity          = 0.65

       Theoretical jump height:

             v²
       h = --------
             2g

         = 12.5²
           -------
           2 × .65

         ≈ 120 pixels

       We don't place coins right at
       the theoretical apex because
       that would require perfect timing.

       Therefore coins stay comfortably
       inside the reachable jump region.
    */


    const jumpHeight = 120;


    // Highest reachable coin position.

    const highestCoinY =
        groundY -
        jumpHeight +
        25;


    // Low enough to collect without
    // requiring a jump.

    const lowestCoinY =
        groundY - 35;


    const y =
        highestCoinY +
        Math.random() *
        (
            lowestCoinY -
            highestCoinY
        );


    coins.push({

        x:W + 30,

        y:y,

        r:11,

        collected:false,

        rotation:
            Math.random() *
            Math.PI
    });
}


/* ============================
   UPDATE
============================ */

function update(dt){

    if(!running || paused)
        return;


    const frame =
        dt / 16.67;


    speed =
        Math.min(
            13,
            6 + score * .025
        );


    distance +=
        speed * frame;


    score =
        Math.floor(
            distance / 10
        );


    scoreEl.textContent =
        score;


    /* DINO PHYSICS */

    dino.vy +=
        .65 * frame;


    if(dino.vy > 14)
        dino.vy = 14;


    dino.y +=
        dino.vy * frame;


    const normalHeight = 58;

    const duckHeight = 34;


    const targetHeight =
        dino.ducking
            ? duckHeight
            : normalHeight;


    if(
        dino.y +
        targetHeight >=
        groundY
    ){

        dino.y =
            groundY -
            targetHeight;

        dino.vy = 0;

        dino.grounded = true;

    }else{

        dino.grounded = false;
    }


    /* OBSTACLE SPAWN */

    spawnTimer -= frame;


    if(spawnTimer <= 0){

        spawnObstacle();


        const difficulty =
            Math.min(
                380,
                score * 2
            );


        spawnTimer =
            Math.max(
                52,
                90 -
                difficulty * .12
            ) +
            Math.random()*35;
    }


    /* COIN SPAWN */

    coinTimer -= frame;


    if(coinTimer <= 0){

        spawnCoin();


        coinTimer =
            75 +
            Math.random()*90;
    }


    /* MOVE OBSTACLES */

    for(
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ){

        const o =
            obstacles[i];


        o.x -=
            speed * frame;


        if(o.type === "bird"){

            o.flap +=
                .15 * frame;

            o.y +=
                Math.sin(
                    o.flap
                ) * .5;
        }


        if(
            !o.passed &&
            o.x + o.width <
            dino.x
        ){

            o.passed = true;
        }


        if(
            o.x + o.width <
            -80
        ){

            obstacles.splice(i,1);

            continue;
        }


        if(
            checkObstacleCollision(o)
        ){

            createExplosion(
                dino.x +
                dino.width/2,

                dino.y + 25
            );

            endGame();

            return;
        }
    }


    /* COINS */

    for(
        let i = coins.length - 1;
        i >= 0;
        i--
    ){

        const c =
            coins[i];


        c.x -=
            speed * frame;


        c.rotation +=
            .1 * frame;


        if(
            !c.collected &&
            circleRectCollision(c)
        ){

            c.collected = true;

            score += 15;


            createCoinParticles(
                c.x,
                c.y
            );
        }


        if(
            c.x < -40 ||
            c.collected
        ){

            coins.splice(i,1);
        }
    }


    /* PARTICLES */

    for(
        let i = particles.length - 1;
        i >= 0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx * frame;

        p.y +=
            p.vy * frame;


        p.vy +=
            .15 * frame;


        p.life -=
            frame;


        if(p.life <= 0){

            particles.splice(i,1);
        }
    }
}


/* ============================
   COLLISION
============================ */

function getDinoRect(){

    const h =
        dino.ducking
            ? 34
            : 58;


    return {

        x:
            dino.x + 8,

        y:
            dino.y + 5,

        width:
            dino.width - 14,

        height:
            h - 8
    };
}


function checkObstacleCollision(o){

    const d =
        getDinoRect();


    const ox =
        o.x + 5;

    const oy =
        o.y + 4;

    const ow =
        o.width - 10;

    const oh =
        o.height - 7;


    return (

        d.x <
        ox + ow &&

        d.x + d.width >
        ox &&

        d.y <
        oy + oh &&

        d.y + d.height >
        oy
    );
}


function circleRectCollision(c){

    const d =
        getDinoRect();


    const closestX =
        Math.max(
            d.x,
            Math.min(
                c.x,
                d.x + d.width
            )
        );


    const closestY =
        Math.max(
            d.y,
            Math.min(
                c.y,
                d.y + d.height
            )
        );


    const dx =
        c.x - closestX;

    const dy =
        c.y - closestY;


    return (
        dx*dx +
        dy*dy <
        c.r*c.r
    );
}


/* ============================
   PARTICLES
============================ */

function createDust(
    x,
    y,
    count
){

    for(let i=0;i<count;i++){

        particles.push({

            x:
                x +
                Math.random()*18,

            y:y,

            vx:
                -Math.random()*2,

            vy:
                -Math.random()*2,

            life:
                25 +
                Math.random()*15,

            size:
                2 +
                Math.random()*4
        });
    }
}


function createCoinParticles(
    x,
    y
){

    for(let i=0;i<10;i++){

        const angle =
            Math.random() *
            Math.PI * 2;


        const power =
            1 +
            Math.random()*3;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                power,

            vy:
                Math.sin(angle) *
                power,

            life:
                25 +
                Math.random()*20,

            size:
                2 +
                Math.random()*3,

            coin:true
        });
    }
}


function createExplosion(
    x,
    y
){

    for(let i=0;i<25;i++){

        const angle =
            Math.random() *
            Math.PI * 2;


        const power =
            1 +
            Math.random()*6;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle) *
                power,

            vy:
                Math.sin(angle) *
                power,

            life:
                35 +
                Math.random()*30,

            size:
                3 +
                Math.random()*5
        });
    }
}


/* ============================
   BACKGROUND
============================ */

function drawBackground(){

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    sky.addColorStop(
        0,
        "#f7d98c"
    );

    sky.addColorStop(
        .55,
        "#f4b46d"
    );

    sky.addColorStop(
        1,
        "#d97762"
    );


    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* SUN */

    ctx.beginPath();

    ctx.arc(
        W*.78,
        H*.19,
        48,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#fff1b0";

    ctx.fill();


    /* MOUNTAINS */

    ctx.fillStyle =
        "#c87568";


    ctx.beginPath();

    ctx.moveTo(
        0,
        H*.63
    );


    for(
        let x=0;
        x<=W;
        x+=100
    ){

        const y =
            H*.63 -
            Math.sin(
                x*.008 +
                distance*.0005
            )*35 -
            20;


        ctx.lineTo(
            x,
            y
        );
    }


    ctx.lineTo(
        W,
        H*.79
    );

    ctx.lineTo(
        0,
        H*.79
    );

    ctx.closePath();

    ctx.fill();


    /* DUNES */

    ctx.fillStyle =
        "#e79a68";


    ctx.beginPath();

    ctx.moveTo(
        0,
        H*.69
    );


    for(
        let x=0;
        x<=W;
        x+=80
    ){

        const y =
            H*.69 +
            Math.sin(
                x*.009 +
                distance*.002
            )*22;


        ctx.lineTo(
            x,
            y
        );
    }


    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        0,
        H
    );

    ctx.closePath();

    ctx.fill();


    /* GROUND */

    ctx.fillStyle =
        "#c66d50";


    ctx.fillRect(
        0,
        groundY,
        W,
        H-groundY
    );


    /* GROUND LINES */

    ctx.strokeStyle =
        "rgba(110,55,55,.22)";

    ctx.lineWidth = 2;


    const offset =
        -(distance % 40);


    for(
        let x=offset;
        x<W;
        x+=40
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            groundY+12
        );

        ctx.lineTo(
            x+18,
            groundY+12
        );

        ctx.stroke();
    }


    /* ROCKS */

    ctx.fillStyle =
        "#9f594d";


    for(let i=0;i<12;i++){

        const x =
            (
                (
                    i*173 -
                    distance*.4
                ) %
                (W+100) +
                W+100
            ) - 50;


        const y =
            groundY +
            25 +
            (i%4)*14;


        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            8+i%4*2,
            3,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}


/* ============================
   DINO DRAW
============================ */

function drawDino(){

    const x =
        dino.x;

    const y =
        dino.y;


    ctx.save();


    /* SHADOW */

    if(dino.grounded){

        ctx.fillStyle =
            "rgba(65,35,35,.25)";


        ctx.beginPath();

        ctx.ellipse(
            x+24,
            groundY+3,
            27,
            6,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.translate(
        x,
        y
    );


    /* TAIL */

    ctx.fillStyle =
        "#384a39";


    ctx.beginPath();

    ctx.moveTo(
        12,
        24
    );

    ctx.lineTo(
        -10,
        35
    );

    ctx.lineTo(
        13,
        34
    );

    ctx.closePath();

    ctx.fill();


    /* BODY */

    ctx.fillStyle =
        "#445b42";


    ctx.beginPath();

    ctx.roundRect(
        10,
        dino.ducking
            ? 12
            : 15,
        31,
        dino.ducking
            ? 22
            : 35,
        8
    );

    ctx.fill();


    /* NECK */

    if(!dino.ducking){

        ctx.fillRect(
            27,
            5,
            13,
            22
        );
    }


    /* HEAD */

    if(!dino.ducking){

        ctx.fillStyle =
            "#526d4d";


        ctx.beginPath();

        ctx.roundRect(
            27,
            0,
            28,
            25,
            7
        );

        ctx.fill();


        /* SNOUT */

        ctx.fillRect(
            49,
            10,
            15,
            9
        );


        /* EYE */

        ctx.fillStyle =
            "#fff";


        ctx.beginPath();

        ctx.arc(
            45,
            7,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#222";


        ctx.beginPath();

        ctx.arc(
            46,
            7,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();


        /* TEETH */

        ctx.fillStyle =
            "#fff4d6";


        for(let i=0;i<3;i++){

            ctx.beginPath();

            ctx.moveTo(
                51+i*4,
                19
            );

            ctx.lineTo(
                54+i*4,
                19
            );

            ctx.lineTo(
                52.5+i*4,
                23
            );

            ctx.closePath();

            ctx.fill();
        }
    }


    /* ARMS */

    if(!dino.ducking){

        ctx.strokeStyle =
            "#384a39";

        ctx.lineWidth = 5;

        ctx.lineCap =
            "round";


        ctx.beginPath();

        ctx.moveTo(
            36,
            25
        );

        ctx.lineTo(
            45,
            31
        );

        ctx.stroke();
    }


    /* LEGS */

    ctx.strokeStyle =
        "#344535";

    ctx.lineWidth = 6;

    ctx.lineCap =
        "round";


    if(dino.ducking){

        ctx.beginPath();

        ctx.moveTo(
            20,
            29
        );

        ctx.lineTo(
            7,
            35
        );


        ctx.moveTo(
            32,
            29
        );

        ctx.lineTo(
            45,
            35
        );

        ctx.stroke();

    }else{

        const run =
            Math.sin(
                distance*.09
            );


        ctx.beginPath();

        ctx.moveTo(
            20,
            44
        );

        ctx.lineTo(
            16-run*7,
            57
        );


        ctx.moveTo(
            35,
            44
        );

        ctx.lineTo(
            39+run*7,
            57
        );

        ctx.stroke();
    }


    ctx.restore();
}


/* ============================
   CACTUS
============================ */

function drawCactus(o){

    ctx.save();

    ctx.translate(
        o.x,
        o.y
    );


    ctx.fillStyle =
        "#416344";


    ctx.beginPath();

    ctx.roundRect(
        7,
        0,
        14,
        o.height,
        6
    );

    ctx.fill();


    if(o.height > 55){

        ctx.fillRect(
            -3,
            22,
            12,
            8
        );

        ctx.fillRect(
            -3,
            15,
            8,
            15
        );

        ctx.fillRect(
            21,
            31,
            11,
            8
        );

        ctx.fillRect(
            26,
            23,
            7,
            16
        );
    }


    ctx.restore();
}


/* ============================
   BIRD
============================ */

function drawBird(o){

    ctx.save();

    ctx.translate(
        o.x,
        o.y
    );


    const flap =
        Math.sin(o.flap)*7;


    ctx.fillStyle =
        "#543a43";


    ctx.beginPath();

    ctx.ellipse(
        24,
        15,
        18,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle =
        "#3e3038";

    ctx.lineWidth = 7;

    ctx.lineCap =
        "round";


    ctx.beginPath();

    ctx.moveTo(
        22,
        12
    );

    ctx.lineTo(
        8,
        4+flap
    );


    ctx.moveTo(
        28,
        13
    );

    ctx.lineTo(
        42,
        4-flap
    );

    ctx.stroke();


    ctx.fillStyle =
        "#fff";


    ctx.beginPath();

    ctx.arc(
        38,
        12,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* ============================
   COIN
============================ */

function drawCoin(c){

    ctx.save();

    ctx.translate(
        c.x,
        c.y
    );


    const squash =
        Math.abs(
            Math.cos(
                c.rotation
            )
        );


    ctx.scale(
        Math.max(.15,squash),
        1
    );


    ctx.fillStyle =
        "#ffd447";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        c.r,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle =
        "#d89528";

    ctx.lineWidth = 3;

    ctx.stroke();


    ctx.fillStyle =
        "#fff2a2";

    ctx.font =
        "bold 12px Nunito";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "$",
        0,
        1
    );


    ctx.restore();
}


/* ============================
   PARTICLES
============================ */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life / 45
            );


        ctx.fillStyle =
            p.coin
                ? "#ffd447"
                : "#f7df9b";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha = 1;
}


/* ============================
   MAIN DRAW
============================ */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    for(
        const c of coins
    ){

        drawCoin(c);
    }


    for(
        const o of obstacles
    ){

        if(
            o.type === "cactus"
        ){

            drawCactus(o);

        }else{

            drawBird(o);
        }
    }


    drawDino();

    drawParticles();


    if(
        paused &&
        running
    ){

        ctx.fillStyle =
            "rgba(50,25,30,.25)";


        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        ctx.fillStyle =
            "#fff4d6";


        ctx.font =
            "bold 42px Righteous";

        ctx.textAlign =
            "center";


        ctx.fillText(
            "PAUSED",
            W/2,
            H/2
        );
    }
}


/* ============================
   GAME LOOP
============================ */

function loop(now){

    const dt =
        Math.min(
            35,
            now - lastTime
        );


    lastTime = now;


    update(dt);

    draw();


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);

</script>
