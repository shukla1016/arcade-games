<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10141c;
    color: #fff;
    font-family: Arial, sans-serif;
  }
  .game {
    width: min(94vw, 520px);
    text-align: center;
  }
  h1 { margin: 0 0 12px; }
  .info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 18px;
  }
  canvas {
    width: min(90vw, 440px);
    height: min(90vw, 440px);
    background: #080b10;
    border: 2px solid #30394a;
    border-radius: 12px;
    display: block;
    margin: auto;
  }
  button {
    border: 0;
    border-radius: 9px;
    background: #2c374a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    padding: 11px 18px;
    cursor: pointer;
  }
  button:hover { background: #3a4961; }
  .controls {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 58px);
    gap: 6px;
    justify-content: center;
  }
  .controls button {
    width: 58px;
    height: 48px;
    padding: 0;
  }
  .up { grid-column: 2; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  #message {
    min-height: 24px;
    margin: 12px 0 4px;
    color: #b9c3d4;
  }
</style>
</head>
<body>

<div class="game">
  <h1>🐍 Snake</h1>

  <div class="info">
    <span>Score: <strong id="score">0</strong></span>
    <span>High Score: <strong id="highScore">0</strong></span>
  </div>

  <canvas id="canvas" width="440" height="440"></canvas>

  <p id="message">Press Start or use an arrow key.</p>

  <button id="startBtn">Start / Restart</button>

  <div class="controls">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

  <p>Use Arrow Keys or WASD</p>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const highScoreEl = document.getElementById("highScore");
  const messageEl = document.getElementById("message");
  const startBtn = document.getElementById("startBtn");

  const SIZE = 22;
  const CELL = canvas.width / SIZE;
  const SPEED = 105;

  let snake = [];
  let food = { x: 0, y: 0 };
  let direction = { x: 1, y: 0 };
  let nextDirection = { x: 1, y: 0 };
  let score = 0;
  let highScore = 0;
  let running = false;
  let gameTimer = null;

  function resetGame() {
    clearInterval(gameTimer);

    snake = [
      { x: 10, y: 11 },
      { x: 9, y: 11 },
      { x: 8, y: 11 }
    ];

    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = score;

    placeFood();

    running = true;
    messageEl.textContent = "Game running!";
    startBtn.textContent = "Restart";

    draw();

    gameTimer = setInterval(gameLoop, SPEED);
  }

  function placeFood() {
    do {
      food.x = Math.floor(Math.random() * SIZE);
      food.y = Math.floor(Math.random() * SIZE);
    } while (
      snake.some(segment => segment.x === food.x && segment.y === food.y)
    );
  }

  function changeDirection(dx, dy) {
    if (!running) {
      resetGame();
    }

    // Prevent immediate reversal.
    if (dx === -direction.x && dy === -direction.y) {
      return;
    }

    nextDirection = { x: dx, y: dy };
  }

  function gameLoop() {
    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    // Wall collision.
    if (
      head.x < 0 ||
      head.x >= SIZE ||
      head.y < 0 ||
      head.y >= SIZE
    ) {
      endGame();
      return;
    }

    // Self collision.
    const ateFood = head.x === food.x && head.y === food.y;
    const bodyToCheck = ateFood ? snake : snake.slice(0, -1);

    if (
      bodyToCheck.some(
        segment => segment.x === head.x && segment.y === head.y
      )
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (ateFood) {
      score++;
      scoreEl.textContent = score;

      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
      }

      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    running = false;
    clearInterval(gameTimer);
    gameTimer = null;
    messageEl.textContent = "Game Over! Press Restart to play again.";
    draw(true);
  }

  function draw(gameOver = false) {
    ctx.fillStyle = "#080b10";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = "#111722";
    ctx.lineWidth = 1;

    for (let i = 0; i <= SIZE; i++) {
      const p = i * CELL;

      ctx.beginPath();
      ctx.moveTo(p, 0);
      ctx.lineTo(p, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, p);
      ctx.lineTo(canvas.width, p);
      ctx.stroke();
    }

    // Food
    ctx.fillStyle = "#ff5c68";
    ctx.beginPath();
    ctx.arc(
      food.x * CELL + CELL / 2,
      food.y * CELL + CELL / 2,
      CELL * 0.35,
      0,
      Math.PI * 2
    );
    ctx.fill();

    // Snake
    snake.forEach((segment, index) => {
      ctx.fillStyle = index === 0 ? "#8ff0b0" : "#55c98a";

      const padding = 2;
      ctx.fillRect(
        segment.x * CELL + padding,
        segment.y * CELL + padding,
        CELL - padding * 2,
        CELL - padding * 2
      );
    });

    if (gameOver) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 34px Arial";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
    }
  }

  document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    const directions = {
      arrowup: [0, -1],
      w: [0, -1],
      arrowdown: [0, 1],
      s: [0, 1],
      arrowleft: [-1, 0],
      a: [-1, 0],
      arrowright: [1, 0],
      d: [1, 0]
    };

    if (directions[key]) {
      event.preventDefault();
      const [dx, dy] = directions[key];
      changeDirection(dx, dy);
    }
  });

  document.querySelectorAll("[data-dir]").forEach(button => {
    button.addEventListener("click", () => {
      const dir = button.dataset.dir;

      const map = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0]
      };

      changeDirection(...map[dir]);
    });
  });

  startBtn.addEventListener("click", resetGame);

  draw();
})();
</script>

</body>
</html>
